{% extends 'base.html' %}
{% block title %}QR Scanner{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
  <h1 class="text-2xl font-bold text-slate-900 mb-1">Device QR Scanner</h1>
  <p class="text-sm text-slate-500 mb-5">Scan a device badge or paste its QR payload to look it up instantly.</p>

  <div class="bg-white rounded-2xl border border-slate-200 p-6">
    <div id="qrReader" class="rounded-xl overflow-hidden mb-4"></div>
    <div class="flex gap-2">
      <input id="qrManual" type="text" placeholder="CAMPUS_DEVICE:LAP-101:SN-DELL-95201"
             class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm">
      <button id="qrLookupBtn" class="bg-indigo-600 text-white px-4 rounded-lg text-sm">Look Up</button>
    </div>
    <div id="qrResult" class="mt-4"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/qr_scanner.js') }}"></script>
{% endblock %}
