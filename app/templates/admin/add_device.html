{% extends 'base.html' %}
{% block title %}Manage Devices{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-slate-900 mb-5">Add / Manage Devices</h1>

<div class="grid lg:grid-cols-2 gap-6">
  <div class="bg-white rounded-2xl border border-slate-200 p-6">
    <h2 class="font-bold text-slate-900 mb-4">Add New Device</h2>
    <form method="POST" class="space-y-3">
      <input name="name" placeholder="Device name" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      <div class="grid grid-cols-2 gap-3">
        <select name="category_id" required class="rounded-lg border border-slate-300 px-3 py-2 text-sm">
          {% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
        </select>
        <input name="brand" placeholder="Brand" class="rounded-lg border border-slate-300 px-3 py-2 text-sm">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <input name="price_per_day" type="number" step="0.01" placeholder="Price/day" class="rounded-lg border border-slate-300 px-3 py-2 text-sm">
        <input name="deposit_amount" type="number" step="0.01" placeholder="Deposit (auto if blank)" class="rounded-lg border border-slate-300 px-3 py-2 text-sm">
      </div>
      <input name="location" placeholder="Location" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      <input name="tags" placeholder="tags, comma, separated" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      <label class="flex items-center gap-2 text-sm text-slate-600">
        <input type="checkbox" name="is_non_electronic"> Non-electronic item
      </label>
      <button class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-lg">Add to Catalog</button>
    </form>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 p-6">
    <h2 class="font-bold text-slate-900 mb-4">Catalog ({{ devices|length }})</h2>
    <div class="space-y-2 max-h-[28rem] overflow-y-auto no-scrollbar" style="scrollbar-width: none;">
      {% for d in devices %}
      <div class="flex items-center justify-between border-b border-slate-100 py-2 text-sm">
        <div><span class="font-medium">{{ d.device_code }}</span> · {{ d.name }}</div>
        <span class="text-xs px-2 py-0.5 rounded-full {{ 'bg-emerald-100 text-emerald-700' if d.status=='available' else 'bg-rose-100 text-rose-700' }}">{{ d.status }}</span>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
